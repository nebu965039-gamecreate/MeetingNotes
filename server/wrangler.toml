# 商談メモ 要約プロキシ Worker
#
# 秘密情報はこのファイルに書かず、wrangler secret で登録する:
#   npx wrangler secret put ANTHROPIC_API_KEY   # Anthropic のAPIキー
#   npx wrangler secret put APP_TOKEN           # アプリ⇔Worker の共有トークン(ランダム文字列)
#   npx wrangler secret put PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON  # (フェーズ2)GCPサービスアカウント鍵JSON
#
# デプロイ:
#   npm install
#   npx wrangler login
#   npx wrangler deploy
# → 出力される https://meetingnotes-summary-proxy.<subdomain>.workers.dev/summarize を
#   アプリの local.properties の SUMMARY_PROXY_URL に設定する。

name = "meetingnotes-summary-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# 文字起こしテキストの最大文字数。超えると 413。
MAX_TRANSCRIPT_CHARS = "60000"
# アプリのパッケージ名(Play Integrity 検証に使用)。
ANDROID_PACKAGE_NAME = "com.manaapps.meetingnotes"
# Play Integrity: "off"(既定) / "audit"(検証してログのみ、通す) / "true"(不正なら拒否)。
# フェーズ2のGCP設定(PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON)完了後に "audit"→"true" と上げる。
PLAY_INTEGRITY_ENABLED = "off"
# RL(KV)バインディング設定時の、全体の1日あたり呼び出し上限。
DAILY_REQUEST_CAP = "1000"

# 全体の1日あたり上限に使う KV Namespace。
[[kv_namespaces]]
binding = "RL"
id = "de61a873c6624c6aad891172e9ed4b45"
